# Builds the Windows installer on GitHub and publishes it as a GitHub release.
#
# Runs when a version tag such as v0.1.3 is pushed (release.ps1 -Publish does this).
# Signing with SignPath switches on by itself once these are set in the repo
# (Settings > Secrets and variables > Actions):
#   secret   SIGNPATH_API_TOKEN
#   variable SIGNPATH_ORGANIZATION_ID
#   variable SIGNPATH_PROJECT_SLUG          (optional, default "respawn")
#   variable SIGNPATH_SIGNING_POLICY_SLUG   (optional, default "release-signing")
# Until then, releases are built unsigned.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub release
  actions: read     # SignPath reads the build details to prove where the files came from

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
      PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'respawn' }}
      POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME does not match version $v in tauri.conf.json"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building Respawn $v (signing: $env:SIGNING)"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: |
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            cargo install tauri-cli --version "^2" --locked
          }

      # 1. Build Respawn.exe (no installer yet, so the app itself can be signed first)
      - name: Build app
        working-directory: src-tauri
        run: cargo tauri build --no-bundle --ci

      - name: Upload app for signing
        if: env.SIGNING == 'true'
        id: app-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: src-tauri/target/release/respawn.exe
          if-no-files-found: error

      - name: Sign app (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.PROJECT_SLUG }}
          signing-policy-slug: ${{ env.POLICY_SLUG }}
          github-artifact-id: ${{ steps.app-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600   # time to approve in SignPath
          output-artifact-directory: signed-app

      - name: Use signed app
        if: env.SIGNING == 'true'
        run: Copy-Item signed-app/respawn.exe src-tauri/target/release/respawn.exe -Force

      # 2. Wrap the (signed) app in the NSIS installer
      - name: Build installer
        working-directory: src-tauri
        run: cargo tauri bundle --bundles nsis --ci

      - name: Find installer
        id: inst
        run: |
          $f = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $f) { throw 'Installer not found' }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $f.FullName out/ -Force
          "path=out/$($f.Name)" >> $env:GITHUB_OUTPUT
          "name=$($f.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload installer for signing
        if: env.SIGNING == 'true'
        id: inst-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: ${{ steps.inst.outputs.path }}
          if-no-files-found: error

      - name: Sign installer (SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.PROJECT_SLUG }}
          signing-policy-slug: ${{ env.POLICY_SLUG }}
          github-artifact-id: ${{ steps.inst-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer

      - name: Use signed installer and check signatures
        if: env.SIGNING == 'true'
        run: |
          Copy-Item "signed-installer/${{ steps.inst.outputs.name }}" "${{ steps.inst.outputs.path }}" -Force
          foreach ($f in @('src-tauri/target/release/respawn.exe', '${{ steps.inst.outputs.path }}')) {
            $s = Get-AuthenticodeSignature $f
            Write-Host "$f -> $($s.Status) ($($s.SignerCertificate.Subject))"
            if ($s.Status -ne 'Valid') { throw "$f is not validly signed" }
          }

      - name: Release notes from ui/changelog.md
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $log = Get-Content ui/changelog.md -Raw
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($v))\b[^\n]*\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { '- Fixes and improvements.' }
          if ($env:SIGNING -ne 'true') { $notes += "`n`n_This build is not code signed yet._" }
          Set-Content -Path notes.md -Value $notes -Encoding utf8

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Respawn ${{ steps.ver.outputs.version }}
          body_path: notes.md
          files: ${{ steps.inst.outputs.path }}

      - name: Keep installer as a build artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: respawn-installer
          path: ${{ steps.inst.outputs.path }}

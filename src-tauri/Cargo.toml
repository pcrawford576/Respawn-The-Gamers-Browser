[package]
name = "respawn"
version = "0.1.2"
description = "Respawn - The Gamers Browser"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" enables multiple webviews inside one window (tabs + sidebar panels).
tauri = { version = "2.5", features = ["unstable"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
# DeepL translator (HTTPS client).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
# Same versions Tauri uses internally, for direct WebView2 settings (wv2.rs).
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
# Keep the shipped binary small.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
